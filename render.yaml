# Render Blueprint for the engine on the free plan (no persistent disk, sleeps after ~15 min
# idle, ~0.1 CPU / 512 MB). The demo collection is pre-built into the image from committed
# sample data, so every cold start comes back with the demo ready; admin writes are ephemeral.
services:
  - type: web
    name: vectorforge-engine
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      # Generated by Render and never needed outside it: the demo is seeded at build time.
      - key: VECTORFORGE_ADMIN_KEY
        generateValue: true
      # Must equal VECTORFORGE_DEMO_KEY on Vercel. Enter it in the Render dashboard.
      - key: VECTORFORGE_DEMO_KEY
        sync: false
      # The production site origin only, exact, e.g. https://vectorforge-olive.vercel.app.
      # No localhost here: that belongs on a local engine, not the hosted one (re-audit R1).
      - key: VECTORFORGE_CORS_ORIGINS
        sync: false
      - key: VECTORFORGE_ENV
        value: production
