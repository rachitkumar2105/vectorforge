name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  # Manual reruns from the Actions tab.
  workflow_dispatch:

# Actions pinned to exact releases that run on Node 24 (Node 20 actions are deprecated).
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Engine must not import ANN libraries
        run: "! grep -rEn '^\\s*(import|from)\\s+(faiss|hnswlib|annoy|scann|nmslib)' vectorforge"
      - name: Lint
        run: ruff check vectorforge tests ../bench
      - name: Format
        run: black --check vectorforge tests ../bench
      - name: Type-check
        run: mypy
      - name: Test with coverage gate
        run: pytest --cov=vectorforge --cov-report=term-missing --cov-fail-under=85
      - name: Dependency audit
        run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          # pnpm version comes from "packageManager" in web/package.json (one source of truth).
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --exit-code 1
