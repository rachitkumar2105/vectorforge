# Alternative deployment with a persistent volume (Fly.io, paid). The free deployment is Render
# (render.yaml at the repository root). Deploy from the repository root:
#   fly deploy --config engine/fly.toml --dockerfile engine/Dockerfile .
# Secrets are set with `fly secrets set`, never here:
#   fly secrets set VECTORFORGE_ADMIN_KEY=... VECTORFORGE_DEMO_KEY=...
app = "vectorforge-engine"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  VECTORFORGE_ENV = "production"
  VECTORFORGE_DATA_DIR = "/data"
  VECTORFORGE_DEMO_COLLECTION = "demo"
  VECTORFORGE_CLIENT_IP_HEADER = "Fly-Client-IP"
  # Exact origins only; replace with the production domain once it exists.
  VECTORFORGE_CORS_ORIGINS = "http://localhost:3000"

[[mounts]]
  source = "vectorforge_data"
  destination = "/data"
  # Daily volume snapshots, kept two weeks (audit finding 5). See docs/OPERATIONS.md for restore.
  scheduled_snapshots = true
  snapshot_retention = 14

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
